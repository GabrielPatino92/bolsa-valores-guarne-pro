openapi: 3.1.0
info:
  title: Guarne Pro API
  version: 0.3.0
  description: >-
    Backend JavaScript-first en Fastify para Guarne Pro.
    Este contrato cubre health, auth, users y providers con persistencia de refresh tokens.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Providers
paths:
  /health:
    get:
      tags: [Health]
      summary: Health and readiness endpoint
      responses:
        '200':
          description: API health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user by email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Return the authenticated user claims
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required: [user]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/providers:
    get:
      tags: [Providers]
      summary: Return the provider catalog with capability flags
      responses:
        '200':
          description: Provider catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCatalogResponse'
  /api/v1/providers/{providerName}:
    get:
      tags: [Providers]
      summary: Return a single provider catalog entry
      parameters:
        - in: path
          name: providerName
          required: true
          schema:
            type: string
            enum: [binance, okx, coinbase, ibkr]
      responses:
        '200':
          description: Provider catalog entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    $ref: '#/components/schemas/Provider'
                required: [provider]
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 30
        fullName:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 8
      required: [email, username, fullName, password]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        fullName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, username, fullName]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
      required: [user, accessToken, refreshToken, tokenType]
    ProviderCapabilities:
      type: object
      properties:
        marketData:
          type: boolean
        accountData:
          type: boolean
        orderExecution:
          type: boolean
        paperTrading:
          type: boolean
        websocket:
          type: boolean
      required: [marketData, accountData, orderExecution, paperTrading, websocket]
    Provider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          enum: [binance, okx, coinbase, ibkr]
        type:
          type: string
          enum: [crypto, forex, stocks, futures]
        displayName:
          type: string
        isActive:
          type: boolean
        supportsTestnet:
          type: boolean
        adapterStatus:
          type: string
          enum: [catalog_only, stubbed, ready]
        createdAt:
          type: string
          format: date-time
        capabilities:
          $ref: '#/components/schemas/ProviderCapabilities'
      required: [id, name, type, displayName, isActive, supportsTestnet, adapterStatus, capabilities]
    ProviderCatalogResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
      required: [providers]
    HealthResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            api:
              type: string
            database:
              type: string
              enum: [ok, degraded]
          required: [api, database]
      required: [service, status, timestamp, checks]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
          required: [code, message]
      required: [error]
